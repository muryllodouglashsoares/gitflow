[package]
name = "gitflow-git"
version = "0.1.0"
description = "Camada Git (consultas e operações locais predefinidas) usada pelo GitFlow Desktop"
edition = "2021"
rust-version = "1.80"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
